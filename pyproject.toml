[project]
name = "modela"
version = "0.1.0"
description = ""
authors = [
    {name = "mustela",email = "ejankowski@gmail.com"}
]
packages = [
    { include = "app" }
]
readme = "README.md"
requires-python = ">=3.11"

[tool.poetry]
packages = [
    { include = "app" }
]

[tool.poetry.scripts]
dev = "run:dev"
worker = "run_worker:main"

[tool.poetry.dependencies]
python = ">=3.14,<3.15"
fastapi = "^v0.138.2"
python-dotenv = "^1.0.0"
sqlalchemy = "^2.0.39"
asyncpg = "^0.31.0"
gunicorn = "26.0.0"
alembic = "^1.15.1"
faker = "40.36.0"
psycopg2-binary = "^2.9.10"
black = "^26.5.1"
ruff = "0.16.1"
python-jose = "^3.3.0"

opentelemetry-instrumentation-fastapi = "^0.63b1"
opentelemetry-instrumentation-sqlalchemy = "^0.63b1"
opentelemetry-instrumentation-logging = "^0.63b1"
opentelemetry-instrumentation-requests = "^0.63b1"
opentelemetry-instrumentation-httpx = "^0.63b1"
prometheus-fastapi-instrumentator = "^8.0.2"
opentelemetry-instrumentation-celery = "0.63b1"
opentelemetry-exporter-otlp-proto-grpc = "^1.42.1"
opentelemetry-sdk = "^1.42.1"
prometheus-client = ">=0.23.1"

requests = "^2.32.3"
pyjwt = "^2.10.1"
sqlalchemy-json = "^0.7.0"
cryptography = "^49.0.0"
fernet = "^1.0.1"
celery = "^5.5.2"
rollbar = "^1.3.0"
redis = "^7.0.0"
fastapi-pagination = "^0.15.13"
# tessera-sdk = { path = "../tessera-sdk-py/", develop = true }
tessera-sdk = { git = "https://github.com/tesserahq/tessera-sdk-py.git", branch = "main" }
pytz = "^2026"
postmarker = "^1.0"
mako = "^1.3.10"
faststream = {extras = ["nats"], version = "^0.7.0"}

pydantic = {extras = ["email"], version = "^2.11.3"}
pydantic-ai = {extras = ["openai"], version = "^1.89.1"}
pydantic-settings = "^2.9.1"

fastmcp = "^3.3.1"
fastmcp-slim = {extras = ["client"], version = "^3.3.1"}


[tool.poetry.dependencies.uvicorn]
extras = [ "standard" ]
version = "^0.52.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
httpx = "^0.28.0"  # Required by FastAPI TestClient
pytest-asyncio = "^1.0.0"

[tool.pytest.ini_options]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::pydantic.warnings.PydanticDeprecatedSince20:tessera_sdk",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
