name: Dependabot auto-merge

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  auto-merge:
    permissions:
      checks: read
      contents: write
      pull-requests: write
    uses: tesserahq/ci-workflows/.github/workflows/dependabot-auto-merge.yml@a1bff14214318dc745b4707427acd63576a1da13 # v0.2.0
    with:
      required-checks: build
