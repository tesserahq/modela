name: Python checks
on:
  # Trigger the workflow on push to the main branch
  push:
    branches:
      - main
  # Trigger the workflow on pull request to the main branch
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (startsWith(github.ref, 'refs/heads/') && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)) }}

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      db:
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: modela_test
        image: pgvector/pgvector:pg18
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/modela_test
      CREDENTIAL_MASTER_KEY: "RrAy78H8PevHw9EJ3a0OZgrHp8RABeXRQQGajzO5NQc="
      ENV: test
      ROLLBAR_ACCESS_TOKEN: 7cd9dd0b5df9462b8ebdfb522af61cd2
    steps:
      - uses: actions/checkout@v7
      - name: Wait for DB to be ready
        run: |
          for i in {1..5}; do
            if pg_isready -h 127.0.0.1 -p 5432; then
              echo "Database is ready"
              exit 0
            fi
            echo "Waiting for DB..."
            sleep 2
          done
      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install dependencies
        run: |
          POETRY_VERSION=$(sed -n 's/.*POETRY_VERSION=\([0-9.]*\).*/\1/p' Dockerfile)
          test -n "$POETRY_VERSION"
          pipx install --python "$(command -v python)" "poetry==$POETRY_VERSION" && poetry install
      - name: Verify production dependency set imports cleanly
        # Match the Dockerfile's Python image, Poetry version, and production
        # dependency set so release-only import failures surface in CI.
        run: |
          POETRY_VERSION=$(sed -n 's/.*POETRY_VERSION=\([0-9.]*\).*/\1/p' Dockerfile)
          PYTHON_IMAGE=$(sed -n 's/^FROM \(python:[^ ]*\) AS python-base/\1/p' Dockerfile)
          test -n "$POETRY_VERSION"
          test -n "$PYTHON_IMAGE"
          # Keep writes out of the checkout: the container runs as root.
          docker run --rm -v "$PWD":/code:ro -w /code "$PYTHON_IMAGE" bash -c "
            apt-get update -qq && apt-get install -qq -y --no-install-recommends curl build-essential libcurl4-openssl-dev libssl-dev postgresql-client libffi-dev libpq-dev >/dev/null &&
            pip install -q poetry==$POETRY_VERSION &&
            POETRY_VIRTUALENVS_IN_PROJECT=false poetry install --only main --no-root &&
            poetry run python -c 'import app.main'
          "
      - name: Lint with ruff
        run: |
          # stop the build if there are Python syntax errors or undefined names
          poetry run ruff check --select=E9,F63,F7,F82
          # exit-zero treats all errors as warnings.
          poetry run ruff check --exit-zero
      - name: Check formatting with black
        uses: psf/black@stable
        with:
          src: ". tests/"
          options: "--check --verbose"
      - name: Run unit tests
        run: |
          poetry run pytest tests/
